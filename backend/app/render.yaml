services:
  - type: web
    name: interview-backend
    runtime: python
    buildCommand: |
      pip install -r backend/app/requirements.txt  # Absolute path
    startCommand: |
      uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://interview-cbot.netlify.app"
        - key: ALLOWED_ORIGINS

