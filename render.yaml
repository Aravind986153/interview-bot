services:
  - type: web
    name: interview-backend
    runtime: python
    buildCommand: |
      pip install -r backend/app/requirements.txt
    startCommand: |
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --ws websockets --ws-ping-interval 20
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
