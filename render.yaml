services:
  - type: web
    name: interview-backend
    runtime: python
    buildCommand: |
      pip install -r backend/app/requirements.txt
    startCommand: |
      export PYTHONPATH=/opt/render/project/src/backend/app && python backend/app/main.py
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/backend/app
      - key: DATABASE_URL
        fromDatabase:
          name: interview-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://interview-cbot.netlify.app
      - key: FRONTEND_URL
        value: https://interview-cbot.netlify.app

databases:
  - name: interview-db
