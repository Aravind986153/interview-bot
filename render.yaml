services:
  - type: web
    name: interview-backend
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/app/requirements.txt
    startCommand: |
      python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --ws websockets
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
